version: 2

models:
  - name: int_month_ends
    description: Month-end calendar from the first month of data to the snapshot date.
    columns:
      - name: month_end
        data_tests: [unique, not_null]
  - name: int_account_mrr_monthly
    description: Account × month-end MRR grid, including $0 months after first contract (needed to detect churn).
    data_tests:
      - dbt_utils_unique_combination:
          arguments: {columns: [account_id, month_end]}
    columns:
      - name: mrr
        description: Sum of contract-line MRR active on the last day of the month.
        data_tests: [not_null]
